name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: https://balostech.example

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: balostech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d balostech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/balostech?schema=public
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: backend
      - run: npx prisma generate --schema prisma/schema.prisma
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run build
        working-directory: backend
